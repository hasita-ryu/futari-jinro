<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6eecf">
    <title>ふたりのほのぼの人狼</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css?v=18">
  </head>
  <body>
    <div class="paper-texture"></div>
    <main id="app" class="app-shell" aria-live="polite"></main>

    <template id="character-template">
      <div class="character" aria-hidden="true">
        <div class="hat"></div>
        <div class="face">
          <span class="eye left"></span>
          <span class="eye right"></span>
          <span class="mouth"></span>
        </div>
        <div class="body"></div>
      </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/app.js?v=18"></script>
  </body>
</html>
